[package]
name = "rv1126b-video-wall"
version = "0.1.0"
edition = "2024"
description = "Local RTSP monitoring wall for the RV1126B camera streamer"

[dependencies]
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }

[profile.release]
lto = "thin"
strip = true
