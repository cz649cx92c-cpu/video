<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f1" />
    <title>RV / VISION</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="boot" id="boot" aria-hidden="true">
      <div class="boot-mark">RV</div>
      <div class="boot-line"><span></span></div>
    </div>

    <div class="app">
      <header class="topbar">
        <a class="brand" href="#" aria-label="RV Vision 首页">
          <span class="brand-mark">RV</span>
          <span class="brand-copy"><strong>VISION</strong><small>CAMERA RECEIVER</small></span>
        </a>
        <div class="clock" aria-label="当前时间">
          <strong id="clock">--:--:--</strong><small id="date">----</small>
        </div>
      </header>

      <div class="shell">
        <aside class="rail">
          <p class="eyebrow">画面范围</p>
          <nav class="filters" aria-label="视频筛选">
            <button class="filter is-active" data-filter="all"><span>全部通道</span><b id="countAll">0 / 8</b></button>
            <button class="filter" data-filter="lower"><span>下层板</span><b id="countLower">0 / 4</b></button>
            <button class="filter" data-filter="upper"><span>上层板</span><b id="countUpper">0 / 4</b></button>
          </nav>

          <div class="rail-spacer"></div>
        </aside>

        <main class="stage">
          <div class="stage-head">
            <div>
              <p class="eyebrow">实时监看</p>
              <h1 id="viewTitle">全部摄像头</h1>
            </div>
            <div class="stage-actions">
              <button class="text-button" id="qualityAll" type="button" data-target="main">切换成主码流</button>
              <button class="icon-button" id="exitFocus" type="button" hidden aria-label="退出聚焦">×</button>
            </div>
          </div>
          <section class="video-grid" id="videoGrid" aria-live="polite"></section>
        </main>

        <aside class="inspector">
          <p class="eyebrow">当前通道</p>
          <div class="channel-number"><span id="selectedBoard">下层板</span><strong id="selectedChannel">01</strong></div>
          <div class="signal-line"><i id="selectedDot"></i><span id="selectedState">等待信号</span></div>

          <dl class="facts">
            <div><dt>设备节点</dt><dd id="selectedDevice">/dev/video1</dd></div>
            <div><dt>显示码流</dt><dd id="selectedQuality">SUB</dd></div>
            <div><dt>分辨率</dt><dd id="selectedResolution">640 × 360</dd></div>
            <div><dt>帧率</dt><dd id="selectedFps">15 FPS</dd></div>
            <div><dt>码率</dt><dd id="selectedBitrate">512 Kbps</dd></div>
          </dl>

          <div class="quality-switch" role="group" aria-label="码流选择">
            <div class="quality-option" data-quality="main">
              <button class="quality-select" type="button" data-quality="main">主码流<small>720P · 25FPS</small></button>
              <button class="quality-config" type="button" data-quality="main" aria-label="设置主码流" aria-controls="settingsBody" aria-expanded="false">⚙</button>
            </div>
            <div class="quality-option is-active" data-quality="sub">
              <button class="quality-select" type="button" data-quality="sub">子码流<small>360P · 15FPS</small></button>
              <button class="quality-config" type="button" data-quality="sub" aria-label="设置子码流" aria-controls="settingsBody" aria-expanded="false">⚙</button>
            </div>
          </div>

          <div class="settings-backdrop" id="settingsBackdrop" hidden></div>
          <form class="quality-editor" id="settingsBody" role="dialog" aria-modal="true" aria-labelledby="editorTitle" hidden>
            <div class="editor-head">
              <span><b id="editorTitle">主码流设置</b><small>8 路摄像头全局生效</small></span>
              <button id="closeSettings" type="button" aria-label="关闭设置">×</button>
            </div>
            <fieldset data-profile="main">
              <label>清晰度
                <select name="mainResolution">
                  <option value="1280x720">1280 × 720</option>
                  <option value="960x540">960 × 540</option>
                  <option value="640x360">640 × 360</option>
                </select>
              </label>
              <div class="settings-row">
                <label>帧率
                  <span class="input-unit"><input name="mainFps" type="number" min="1" max="25" step="1" required><em>FPS</em></span>
                </label>
                <label>码率
                  <span class="input-unit"><input name="mainBitrate" type="number" min="256" max="4096" step="128" required><em>Kbps</em></span>
                </label>
              </div>
            </fieldset>
            <fieldset data-profile="sub" hidden>
              <label>清晰度
                <select name="subResolution">
                  <option value="640x360">640 × 360</option>
                  <option value="480x270">480 × 270</option>
                  <option value="320x180">320 × 180</option>
                </select>
              </label>
              <div class="settings-row">
                <label>帧率
                  <span class="input-unit"><input name="subFps" type="number" min="1" max="25" step="1" required><em>FPS</em></span>
                </label>
                <label>码率
                  <span class="input-unit"><input name="subBitrate" type="number" min="64" max="1024" step="64" required><em>Kbps</em></span>
                </label>
              </div>
            </fieldset>
            <div class="settings-submit">
              <p id="settingsStatus" role="status">正在读取板端当前配置…</p>
              <button id="saveSettings" type="submit">应用设置</button>
            </div>
          </form>

          <button class="focus-action" id="focusAction" type="button">
            <span>聚焦查看</span><b>↗</b>
          </button>
          <p class="hint">双击任意画面也可以进入或退出聚焦模式。</p>

        </aside>
      </div>
    </div>

    <script src="/vendor/mediamtx-reader.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
